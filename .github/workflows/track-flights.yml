name: Escaneo diario de vuelos SJO → CDMX

on:
  # PAUSADO TEMPORALMENTE: cuando volvamos en diciembre, quitamos el "#" de las 2 líneas siguientes
  # schedule:
  #   - cron: "0 14 * * *"  # 14:00 UTC = 8:00 AM hora de Costa Rica (UTC-6)
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Forzar envío de reporte a Telegram hoy"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  track-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar rastreador de vuelos
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            python3 tracker.py --force-notify
          else
            python3 tracker.py
          fi

      - name: Guardar histórico actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --staged --quiet; then
            echo "No hubo cambios nuevos en los datos."
          else
            git commit -m "chore: actualizar precios de vuelos ($(date -u +'%Y-%m-%d'))"
            git push
          fi
